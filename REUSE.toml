version = 1
SPDX-PackageName = "espeyu"
SPDX-PackageDownloadLocation = "https://github.com/abrahammenendez/espeyu"

[[annotations]]
path = [
    ".claude/**",
    ".commitlintrc.yml",
    ".github/**",
    ".gitignore",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "app/src/test/screenshots/**",
    "docs/**",
    "fastlane/**",
    "gradle/*",
    "imgs/google/**",
]
SPDX-FileCopyrightText = "2026 Abraham Menéndez"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["gradle/wrapper/**", "gradlew", "gradlew.bat"]
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["app/src/main/res/font/inter_variable.ttf"]
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["app/src/main/res/font/buenard_variable.ttf"]
SPDX-FileCopyrightText = "2011 The Buenard Project Authors (https://github.com/googlefonts/buenard)"
SPDX-License-Identifier = "OFL-1.1"
