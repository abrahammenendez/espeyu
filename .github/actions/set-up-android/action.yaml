name: Set up Android
description: Installs the JDK, SDK and Gradle that every job building this app needs.
runs:
  using: composite
  steps:
    # Matches the daemon criteria in gradle/gradle-daemon-jvm.properties, so Gradle
    # runs on this JDK instead of provisioning its own.
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
    - name: Set up the Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-37.0 build-tools;36.0.0'
    # The caching this action reaches for by default is proprietary and carries
    # Gradle's own terms of use. Basic caching is the MIT one.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
